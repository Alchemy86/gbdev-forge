[package]
name = "forge-png2tile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PNG -> Game Boy 2BPP tile converter with smart flip-aware dedup"

[[bin]]
name = "forge-png2tile"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../../crates/forge-core" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
