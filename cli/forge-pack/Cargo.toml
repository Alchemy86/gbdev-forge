[package]
name = "forge-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Map / meta-sprite packer: tile-reference output -> compact VRAM-ready index arrays"

[[bin]]
name = "forge-pack"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../../crates/forge-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
